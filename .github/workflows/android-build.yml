name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: platform-tools
        shell: bash
        run: |
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee sdk-install.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        id: assemble
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee assemble-debug.log
      - name: Upload APK before lint
        uses: actions/upload-artifact@v4
        with:
          name: SubThai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Android lint
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:lintDebug 2>&1 | tee lint-debug.log
      - name: Upload diagnostic logs and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-diagnostics
          path: |
            sdk-install.log
            assemble-debug.log
            lint-debug.log
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14

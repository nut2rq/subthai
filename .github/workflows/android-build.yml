name: SubThai Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subthai-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/subthai/app/MainActivity.java

      - name: Assemble Debug APK
        id: assemble
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee assemble-debug.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubThai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: success()
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "## SubThai Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK artifact: SubThai-debug-apk (app-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK size:" "$(du -h "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256:" "$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the SubThai-debug-apk artifact from this workflow run." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Android lint
        if: ${{ steps.assemble.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:lintDebug 2>&1 | tee lint-debug.log

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubThai-build-diagnostics
          path: |
            assemble-debug.log
            lint-debug.log
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
